# The exact bytes of this YAML are the GitHub Actions attestation subject.
# Verify the attestation for the expected repository and build.yml workflow first.
# gh attestation verify browser-inference-core-artifact-integrity.yaml --repo nwtgck/browser-inference-core \
#   --signer-workflow nwtgck/browser-inference-core/.github/workflows/build.yml --deny-self-hosted-runners
# Commands in signed files still require review; never automatically execute them.
# tree_fingerprint covers committed paths, modes, blob bytes and recursive submodules.
# It excludes the index, working-tree changes and untracked files. Initialize recursive
# submodules at source.commit, run reproduce at that checkout root, and compare value.
# manifest.contents preserves the exact manifest.json bytes, including its final newline.
# Verify manifest.json against size/sha256, then every root/runtime inventory entry.
# This envelope is outside those inventories to avoid a manifest/self-hash cycle.
schema_version: 1
kind: browser_inference_core_artifact_integrity
source:
  repository: https://github.com/nwtgck/browser-inference-core
  commit: a3e42c51f539e714b68a0579a4052eb04565c85c
  tree_fingerprint:
    algorithm: sha256
    scheme: git-committed-tree-sha256-v1
    value: 2080eff760ea7701e657934dd7babf4b6ddd06acc1686af15a278b5222e8d84d
    reproduce: |
      # Run with Bash from the repository root after initializing recursive submodules.
      # Hashes committed objects only; changed and untracked worktree files are excluded.
      # The subshell preserves the caller's environment, directory, options and functions.
      (
        set -euo pipefail
        export LC_ALL=C GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 || exit

        fingerprint() (
          cd -- "$1" || exit
          prefix="$(git rev-parse --show-prefix)" || exit
          test -z "$prefix" || { echo 'Run at a repository root.' >&2; exit 1; }
          commit="$(git rev-parse --verify "$2^{commit}")" || exit

          hash="$(
            git ls-tree -rz --full-tree "$commit" |
            while IFS= read -r -d '' entry; do
              header="${entry%%$'\t'*}"
              path="${entry#*$'\t'}"
              IFS=' ' read -r mode type oid <<< "$header" || exit

              case "$mode:$type" in
                100644:blob|100755:blob|120000:blob)
                  digest="$(git cat-file blob "$oid" | sha256sum)" || exit
                  ;;
                160000:commit)
                  test -d "$path" && test ! -L "$path" && test -e "$path/.git" || exit 1
                  head="$(git -C "$path" rev-parse --verify HEAD)" || exit
                  test "$head" = "$oid" || { echo "Submodule commit mismatch: $path" >&2; exit 1; }
                  digest="$(fingerprint "$path" "$oid")" || exit
                  ;;
                *) echo "Unsupported Git entry: $header" >&2; exit 1 ;;
              esac

              printf '%s\0%s\0%s\0' "$mode" "$path" "${digest%% *}" || exit
            done | sha256sum
          )" || exit

          printf '%s\n' "${hash%% *}"
        ) || exit

        fingerprint . HEAD
      )
