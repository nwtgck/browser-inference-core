name: Update llama.cpp stable / shared updater

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      target:
        type: string
        required: true
      custom_ref:
        type: string
        default: ''
      allow_non_fast_forward:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: 'Upstream channel (latest is stable; latest-unstable is a released nightly)'
        type: choice
        options: [latest, custom]
        default: latest
        required: true
      custom_ref:
        description: 'Only for custom: upstream tag, branch, or full 40-character commit SHA'
        type: string
        default: ''
      allow_non_fast_forward:
        description: 'Explicitly allow an older or divergent upstream revision'
        type: boolean
        default: false

# Read-only defaults for jobs without their own permissions. This is not a cap:
# jobs.update.permissions overrides it with the write access needed for git push.
defaults:
  run:
    working-directory: llama-cpp

permissions:
  contents: read

jobs:
  update:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job needs contents: write to push the candidate branch (write includes
    # read). It overrides the workflow default; contents: read alone cannot push.
    # Branch preparation only: no PR writes or workflow-dispatch permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Check out only the selected registered source
        env:
          SOURCE_ID: ${{ inputs.source || 'upstream-stable' }}
        run: python3 scripts/checkout_source.py --source "$SOURCE_ID"
      - name: Resolve upstream, push the candidate branch, and show the PR form link
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ inputs.source || 'upstream-stable' }}
          TARGET: ${{ inputs.target }}
          CUSTOM_REF: ${{ inputs.custom_ref }}
          BASE: ${{ github.ref_name }}
          ALLOW_NON_FAST_FORWARD: ${{ inputs.allow_non_fast_forward }}
        shell: bash
        run: |
          extra=()
          if [[ "$ALLOW_NON_FAST_FORWARD" == "true" ]]; then
            extra+=(--allow-non-fast-forward)
          fi
          python3 scripts/update_llama_cpp.py --source "$SOURCE_ID" --target "$TARGET" --custom-ref "$CUSTOM_REF" --base "$BASE" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-update-report
          path: llama-cpp/build/upstream-update/
          if-no-files-found: ignore
          retention-days: 14
