          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          npm run tooling:build
          BICORE_OFFLINE
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-build-*
          path: build/runtimes/stable-diffusion-cpp/
          merge-multiple: true
      - name: Assemble runtime-only package
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js package runtime --runtime stable-diffusion-cpp \
            --checkout-root "$GITHUB_WORKSPACE" --build-root "$GITHUB_WORKSPACE/build/runtimes/stable-diffusion-cpp/stage" \
            --output "$GITHUB_WORKSPACE/build/runtime-packages/stable-diffusion-cpp" --defer-npm-pack \
            --license-root "$GITHUB_WORKSPACE/build/runtimes/stable-diffusion-cpp/toolchain-licenses/emscripten" \
            --license-root "$GITHUB_WORKSPACE/build/runtimes/stable-diffusion-cpp/toolchain-licenses/emdawnwebgpu_pkg"
          BICORE_OFFLINE
      - name: Install browser test harness (online)
        shell: bash
        run: |
          npm install --prefix .tools/browser --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Prepare Chromium (online)
        shell: bash
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" .tools/browser/node_modules/.bin/playwright install chromium
      - name: Test and finalize the same runtime snapshot
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js validation runtime --runtime stable-diffusion-cpp \
            --checkout-root "$GITHUB_WORKSPACE" --package "$GITHUB_WORKSPACE/build/runtime-packages/stable-diffusion-cpp" \
            --receipt "$GITHUB_WORKSPACE/build/runtime-validation/stable-diffusion-cpp.json"
          BICORE_OFFLINE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: image-runtime-package
          path: build/runtime-packages/stable-diffusion-cpp/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/ci/cli.js summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-image-build
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14
  publish:
    needs: [build, image-build]
    # Ordinary same-repository PR heads have the same publication trust as
    # source pushes. Fork PRs and Dependabot runs never receive write credentials.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BIC_METRICS_RUNTIME: root
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          # Only the llama source overlay is read by consumer provenance.
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq unzip \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          bash .github/scripts/run-offline.sh \
            -e HOME=/tmp "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out the pinned upstreams used by source verification
        run: git submodule update --init --checkout --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp runtimes/stable-diffusion-cpp/vendor/stable-diffusion.cpp runtimes/stable-diffusion-cpp/vendor/ggml-webgpu-source
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
      - name: Acquire locked development dependencies (online)
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit the checked-out tools and verify source identity
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          npm run tooling:build
          BICORE_OFFLINE
      - uses: actions/download-artifact@v8.0.2
        with:
          name: llama-runtime-package
          path: build/package-inputs/llama-cpp/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: image-runtime-package
          path: build/package-inputs/stable-diffusion-cpp/
      - name: Assemble and freeze the source-bound publication tree
        id: freeze
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js package assemble --checkout-root "$GITHUB_WORKSPACE" \
            --inputs "$GITHUB_WORKSPACE/build/package-inputs" --output "$GITHUB_WORKSPACE/dist/package" --defer-npm-pack
          node build/tooling/tools/cli.js publication freeze --checkout-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/package" --work-root "$GITHUB_WORKSPACE/build/publication/package" \
            --receipt "$GITHUB_WORKSPACE/build/publication/frozen.json" --branch artifacts \
            --source-commit "$LCB_SOURCE_COMMIT" --source-work-root "$GITHUB_WORKSPACE/build/publication/sources" --python python3
          jq -r '"tree=\(.tree)\nsource-commit=\(.sourceCommit)"' build/publication/frozen.json >> "$GITHUB_OUTPUT"
          BICORE_OFFLINE
      - name: Publish append-only artifact commit
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REMOTE: https://github.com/${{ github.repository }}.git
          ARTIFACT_BRANCH: artifacts
          PUBLISH_ATTEMPTS: '20'
          FROZEN_TREE: ${{ steps.freeze.outputs.tree }}
          FROZEN_SOURCE: ${{ steps.freeze.outputs.source-commit }}
        run: |

          # Only this step sends Git credentials and contacts the artifact remote.
          # Every candidate keeps the same already-verified tree and extends the fetched
          # branch tip. Never force-push, replace source branches, or re-pack on a retry.
          [[ "$FROZEN_TREE" =~ ^[0-9a-f]{40}$ && "$FROZEN_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_BRANCH" == artifacts || "$ARTIFACT_BRANCH" == artifacts/* ]]
          git check-ref-format --branch "$ARTIFACT_BRANCH"
          work="$GITHUB_WORKSPACE/build/publication/package"
          ref="refs/heads/$ARTIFACT_BRANCH"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git -C "$work" remote add origin "$PUBLISH_REMOTE"
          [[ "$PUBLISH_ATTEMPTS" =~ ^[1-9][0-9]*$ && "$PUBLISH_ATTEMPTS" -le 20 ]]
          for attempt in $(seq 1 "$PUBLISH_ATTEMPTS"); do
            parent=()
            probe_status=0
            remote_head="$(git -C "$work" ls-remote --exit-code --heads origin "$ref")" || probe_status=$?
            [[ "$probe_status" == 0 || "$probe_status" == 2 ]]
            if [[ -n "$remote_head" ]]; then
              git -C "$work" fetch --no-tags --depth=1 origin "$ref"
              parent=(-p "$(git -C "$work" rev-parse --verify FETCH_HEAD)")
            fi
            commit="$(git -C "$work" commit-tree "$FROZEN_TREE" "${parent[@]}" \
              -m "build(artifacts): publish runtime from ${FROZEN_SOURCE:0:12}" \
              -m "Source-commit: $FROZEN_SOURCE")"
            error_file="$(mktemp "$RUNNER_TEMP/bicore-push.XXXXXX")"
            if git -C "$work" push origin "$commit:$ref" > "$error_file" 2>&1; then
              cat "$error_file"
              printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$error_file" >&2
            # A server may accept a push and lose only its response. Reconcile ancestry
            # before deciding whether to retry or report a failure. A later publication
            # can already be on top of ours, so equality of remote tips is insufficient.
            probe_status=0
            remote_head="$(git -C "$work" ls-remote --exit-code --heads origin "$ref")" || probe_status=$?
            [[ "$probe_status" == 0 || "$probe_status" == 2 ]]
            if [[ -n "$remote_head" ]]; then
              git -C "$work" fetch --no-tags --depth=64 origin "$ref"
              while true; do
                if git -C "$work" merge-base --is-ancestor "$commit" FETCH_HEAD; then
                  printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                if [[ "$(git -C "$work" rev-parse --is-shallow-repository)" != true ]]; then break; fi
                git -C "$work" fetch --no-tags --deepen=64 origin "$ref"
              done
            fi
            if ! grep -Eq 'non-fast-forward|fetch first|cannot lock ref' "$error_file"; then
              exit 1
            fi
            sleep "$(( attempt < 5 ? attempt : 5 ))"
          done
          echo 'Publication conflicted repeatedly; rerun this job. No history was overwritten.' >&2
          exit 1
      - name: Confirm publication and prepare a fresh npm fixture
        env:
          ARTIFACT_COMMIT: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID -e ARTIFACT_COMMIT \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          {
            printf '## Runtime artifact commit\n\n`%s`\n\n**Source commit:** `%s`\n\n' "$ARTIFACT_COMMIT" "$LCB_SOURCE_COMMIT"
            if source_title="$(git -C "$GITHUB_WORKSPACE" show -s --format=%s "$LCB_SOURCE_COMMIT" | jq -Rr @html)"; then
              printf '**Source commit title:** <code>%s</code>\n\n' "$source_title"
            fi
            printf '```sh\nnpm install github:%s#%s\n```\n\n' "$GITHUB_REPOSITORY" "$ARTIFACT_COMMIT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          node build/tooling/tools/cli.js publication confirm --work-root "$GITHUB_WORKSPACE/build/publication/package" \
            --receipt "$GITHUB_WORKSPACE/build/publication/frozen.json" --commit "$ARTIFACT_COMMIT"
          version="$(jq -er '.report.data.package.version' build/publication/frozen.json)"
          node build/tooling/tools/cli.js publication npm-fixture --directory "$GITHUB_WORKSPACE/build/consumer-lock" \
            --repository "$GITHUB_REPOSITORY" --commit "$ARTIFACT_COMMIT" --version "$version"
          BICORE_OFFLINE
      - name: Resolve the published npm dependency (online)
        shell: bash
        run: |

          # Resolve only this published, dependency-free package. No lifecycle hooks,
          # consumer configuration, shared cache, registry audit or funding requests.
          cd build/consumer-lock
          export NPM_CONFIG_CACHE="$PWD/cache" NPM_CONFIG_USERCONFIG="$PWD/empty.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$PWD/empty-global.npmrc" GIT_TERMINAL_PROMPT=0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3
      - name: Generate consumer integration metadata from the confirmed receipt
        env:
          ARTIFACT_COMMIT: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID -e ARTIFACT_COMMIT \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js publication report --work-root "$GITHUB_WORKSPACE/build/publication/package" \
            --receipt "$GITHUB_WORKSPACE/build/publication/frozen.json" --commit "$ARTIFACT_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" --npm-fixture "$GITHUB_WORKSPACE/build/consumer-lock" \
            --output "$GITHUB_WORKSPACE/build/consumer-update"
          tee -a "$GITHUB_STEP_SUMMARY" < "$GITHUB_WORKSPACE/build/consumer-update/report.md"
          BICORE_OFFLINE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: consumer-update-${{ github.run_attempt }}
          path: build/consumer-update/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve publication status after a reporting failure
        if: failure() && steps.publish.outputs.commit != ''
        env:
          ARTIFACT_COMMIT: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID -e ARTIFACT_COMMIT \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          echo "Runtime artifact $ARTIFACT_COMMIT is already published; consumer reporting failed." >> "$GITHUB_STEP_SUMMARY"
          BICORE_OFFLINE
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/ci/cli.js summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-publish
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14
