[package]
name = "bicore-wasm-encoder"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Build tooling verifies this checkout against toolchain.json before Cargo runs.
wasmparser = { path = "../../../.tools/wasm-tools/crates/wasmparser" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
