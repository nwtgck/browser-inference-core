version: 2
updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: disabled
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Asia/Tokyo
    # This delay applies only to version updates; security updates are immediate.
    cooldown:
      default-days: 5
    assignees:
      - nwtgck
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Review breaking updates separately from routine minor/patch updates.
    groups:
      production-minor-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Asia/Tokyo
    # This delay applies only to version updates; security updates are immediate.
    cooldown:
      default-days: 5
    assignees:
      - nwtgck
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
