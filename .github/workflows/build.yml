name: Build and publish runtime

on:
  push:
    branches-ignore:
      - artifacts
      - 'artifacts/**'
  # A human-created PR is the handoff after the updater's GITHUB_TOKEN push.
  # Push + synchronize duplicates are intentional; there is no deduplication gate.
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - artifacts
      - 'artifacts/**'
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Shared cache use (cold also forbids saving)
        type: choice
        default: enabled
        options: [enabled, cold]
      metrics_mode:
        description: Optional pipeline timings (does not disable validation or tests)
        type: choice
        options: [basic, 'off']
        default: basic

# Network operations belong at explicit workflow boundaries for auditability.
# Keep destinations, credentials and remote writes visible here instead of hiding
# them in repository Python/shell wrappers. Local processing belongs in ordinary typed modules.
# PR events normally check out a synthetic merge commit. All jobs deliberately
# build the immutable PR head instead, so push and PR artifacts share a source
# identity and comments can match the manifest to the actual PR head.
env:
  BIC_CACHE_MODE: ${{ github.event.inputs.cache_mode || 'enabled' }}
  LCB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  BIC_METRICS_MODE: ${{ inputs.metrics_mode || 'basic' }}

defaults:
  run:
    working-directory: .

permissions:
  contents: read

jobs:
  test:
    name: Test host and publication code
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BIC_METRICS_RUNTIME: llama-cpp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq unzip zip \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          bash .github/scripts/run-offline.sh \
            -e HOME=/tmp "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out only this runtime's pinned upstreams
        working-directory: .
        run: git submodule update --init --recursive --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
      - name: Acquire locked development dependencies (online)
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Acquire pinned Dawn headers for native contracts (online)
        shell: bash
        run: |
          tag="$(jq -er '.dawnTag | select(test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))' toolchain/config.json)"
          checksum="$(jq -er '.dawnSha256 | select(test("^[a-f0-9]{64}$"))' toolchain/config.json)"
          mkdir -p .tools/downloads
          archive=".tools/downloads/emdawnwebgpu_pkg-${tag}.zip"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "https://github.com/google/dawn/releases/download/${tag}/emdawnwebgpu_pkg-${tag}.zip" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check -
      - name: Emit the checked-out tools and verify source identity
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          npm run tooling:build
          BICORE_OFFLINE
      - name: Test host, tooling and current native contracts
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js toolchain prepare \
            --checkout-root "$GITHUB_WORKSPACE" --tools-root "$GITHUB_WORKSPACE/.tools" --dawn-only
          export LCB_TEST_DAWN_PACKAGE="$GITHUB_WORKSPACE/.tools/emdawnwebgpu_pkg"
          npm run lint -- 00-dto tools runtimes/llama-cpp/tools runtimes/stable-diffusion-cpp/tools tests/tools tests/runtimes/llama-cpp tests/runtimes/stable-diffusion-cpp
          npm run test:lint
          shopt -s globstar
          BIC_METRICS_MODE=off node --test build/tooling/tests/tools/**/*.test.js \
            build/tooling/tests/runtimes/llama-cpp/tools/**/*.test.js
          BIC_METRICS_MODE=off node --test tests/tools/cli/*.test.mjs tests/runtimes/llama_cpp/*.test.mjs
          BIC_METRICS_MODE=off python3 -m unittest \
            tests.runtimes.llama_cpp.source.test_native_quantization \
            tests.runtimes.llama_cpp.source.test_q4_reference \
            tests.runtimes.llama_cpp.source.test_iq3_fixtures \
            tests.runtimes.llama_cpp.test_cmake_property_snapshot
          node --test build/tooling/tests/runtimes/llama-cpp/native-validation.test.js
          BICORE_OFFLINE
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/ci/cli.js summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-test
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14
  qsa-native:
    name: Compare QSA all-pools native graphs
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BIC_METRICS_RUNTIME: llama-cpp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq unzip \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          bash .github/scripts/run-offline.sh \
            -e HOME=/tmp "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out only this runtime's pinned upstreams
        working-directory: .
        run: git submodule update --init --recursive --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
      - name: Acquire locked development dependencies (online)
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit the checked-out tools and verify source identity
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          npm run tooling:build
          BICORE_OFFLINE
      - name: Compare separate reference and optimized native builds
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tests/runtimes/llama-cpp/tools/qsa.test-support.js \
            --checkout-root "$GITHUB_WORKSPACE" --tooling-root "$GITHUB_WORKSPACE/build/tooling" \
            --output-root "$GITHUB_WORKSPACE/build/qsa-regression" --toolchain-root "$GITHUB_WORKSPACE/.tools" \
            --expected-commit "$LCB_SOURCE_COMMIT" --jobs 2
          BICORE_OFFLINE
      - name: Upload native comparison traces and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qsa-native-${{ github.run_attempt }}
          path: build/qsa-regression/qsa-results/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/ci/cli.js summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-qsa-native
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 1
  compile:
    name: Build llama.cpp ${{ matrix.profile }} / ${{ matrix.variant }}
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Intentionally omit max-parallel: use all available runners to reduce build wait time.
      # Do not add a workflow-level parallelism cap; runner/account limits still apply.
      matrix:
        profile:
          - cpu-wasm32
          - webgpu-wasm64-jspi-gpu-profile
          - webgpu-wasm32-asyncify
          - webgpu-wasm32-jspi
          - webgpu-wasm64-jspi
        variant:
          - browser
          - test
    env:
      BIC_METRICS_RUNTIME: llama-cpp
      BIC_METRICS_PROFILE: ${{ matrix.profile }}
      BIC_METRICS_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq unzip \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          bash .github/scripts/run-offline.sh \
            -e HOME=/tmp "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out only this runtime's pinned upstreams
        working-directory: .
        run: git submodule update --init --recursive --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
      - name: Acquire locked development dependencies (online)
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit tools and plan cache partitions
        id: plan
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          node node_modules/typescript/bin/tsc --project tsconfig.llama-cpp.json
          node build/tooling/runtimes/llama-cpp/tools/cli.js cache-plan \
            --profile "$BIC_METRICS_PROFILE" --variant "$BIC_METRICS_VARIANT" \
            --checkout-root "$GITHUB_WORKSPACE" --work-root "$GITHUB_WORKSPACE" \
            --source-commit "$LCB_SOURCE_COMMIT" --ccache-version "$(ccache --version | head -n 1)" \
            --environment "$BIC_OFFLINE_ENVIRONMENT" --os "$RUNNER_OS" --arch "$RUNNER_ARCH" \
            --output "$GITHUB_WORKSPACE/build/cache-plan.json"
          jq -r '"dawn-key=\(.dawnKey)\nem-key=\(.emKey)\nem-prefix=\(.emRestorePrefix)\ncc-key=\(.ccKey)\ncc-prefix=\(.ccRestorePrefix)\nem-staging=\(.emStagingPath)\ncc-staging=\(.ccStagingPath)"' build/cache-plan.json >> "$GITHUB_OUTPUT"
          jq -r '.environment | to_entries[] | "\(.key)=\(.value)"' build/cache-plan.json >> "$GITHUB_ENV"
          jq -er '
            if (.emsdkVersion | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
               (.emscriptenRelease | test("^[0-9a-f]{40}$")) and
               (.dawnTag | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
               (.dawnSha256 | test("^[0-9a-f]{64}$"))
            then "emsdk-version=\(.emsdkVersion)\nemscripten-release=\(.emscriptenRelease)\ndawn-tag=\(.dawnTag)\ndawn-sha256=\(.dawnSha256)"
            else error("Invalid pinned acquisition settings") end
          ' toolchain/config.json >> "$GITHUB_OUTPUT"
          BICORE_OFFLINE
      - uses: actions/cache/restore@v6.1.0
        id: dawn
        if: env.BIC_CACHE_MODE != 'cold'
        continue-on-error: true
        with:
          key: ${{ steps.plan.outputs.dawn-key }}
          path: .cache/restored/dawn
      - uses: actions/cache/restore@v6.1.0
        id: em
        if: env.BIC_CACHE_MODE != 'cold'
        continue-on-error: true
        with:
          key: ${{ steps.plan.outputs.em-key }}
          path: ${{ steps.plan.outputs.em-staging }}
          restore-keys: ${{ steps.plan.outputs.em-prefix }}
      - uses: actions/cache/restore@v6.1.0
        id: cc
        if: env.BIC_CACHE_MODE != 'cold'
        continue-on-error: true
        with:
          key: ${{ steps.plan.outputs.cc-key }}
          path: ${{ steps.plan.outputs.cc-staging }}
          restore-keys: ${{ steps.plan.outputs.cc-prefix }}
      - name: Acquire pinned compiler (online)
        shell: bash
        working-directory: .
        env:
          EMSDK_VERSION: ${{ steps.plan.outputs.emsdk-version }}
          EMSCRIPTEN_RELEASE: ${{ steps.plan.outputs.emscripten-release }}
        run: |
          if [[ ! -d .tools/emsdk ]]; then
            git clone --depth 1 --branch "$EMSDK_VERSION" \
              https://github.com/emscripten-core/emsdk.git .tools/emsdk
          fi
          actual_release="$(jq -er --arg version "$EMSDK_VERSION" '.releases[$version]' .tools/emsdk/emscripten-releases-tags.json)"
          test "$actual_release" = "$EMSCRIPTEN_RELEASE"
          cd .tools/emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          npm ci --prefix "$PWD/upstream/emscripten" --include=dev --ignore-scripts --no-audit --no-fund
      - name: Acquire pinned Dawn archive (online on cache miss)
        env:
          DAWN_TAG: ${{ steps.plan.outputs.dawn-tag }}
          DAWN_SHA256: ${{ steps.plan.outputs.dawn-sha256 }}
          REQUESTED: ${{ steps.plan.outputs.dawn-key }}
          MATCHED: ${{ steps.dawn.outputs.cache-matched-key }}
          RESTORE_OUTCOME: ${{ steps.dawn.outcome }}
        shell: bash
        run: |
          mkdir -p .tools/downloads
          archive=".tools/downloads/emdawnwebgpu_pkg-${DAWN_TAG}.zip"
          restored=".cache/restored/dawn/emdawnwebgpu_pkg-${DAWN_TAG}.zip"
          if [[ "$RESTORE_OUTCOME" == success && "$MATCHED" == "$REQUESTED" && -f "$restored" && ! -L "$restored" ]]; then
            if printf '%s  %s\n' "$DAWN_SHA256" "$restored" | sha256sum --check -; then
              cp "$restored" "$archive"
            fi
          fi
          if [[ ! -f "$archive" ]]; then
            temporary="$(mktemp .tools/downloads/dawn-download.XXXXXX)"
            trap 'rm -f "$temporary"' EXIT
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              "https://github.com/google/dawn/releases/download/${DAWN_TAG}/emdawnwebgpu_pkg-${DAWN_TAG}.zip" \
              --output "$temporary"
            printf '%s  %s\n' "$DAWN_SHA256" "$temporary" | sha256sum --check -
            mv "$temporary" "$archive"
            trap - EXIT
          fi
      - name: Prepare, build and stage the selected runtime
        if: success()
        env:
          DAWN_MATCHED: ${{ steps.dawn.outputs.cache-matched-key }}
          DAWN_HIT: ${{ steps.dawn.outputs.cache-hit }}
          DAWN_OUTCOME: ${{ steps.dawn.outcome }}
          EM_MATCHED: ${{ steps.em.outputs.cache-matched-key }}
          EM_HIT: ${{ steps.em.outputs.cache-hit }}
          EM_OUTCOME: ${{ steps.em.outcome }}
          CC_MATCHED: ${{ steps.cc.outputs.cache-matched-key }}
          CC_HIT: ${{ steps.cc.outputs.cache-hit }}
          CC_OUTCOME: ${{ steps.cc.outcome }}
          SAVE_CACHES: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.actor != 'dependabot[bot]' && env.BIC_CACHE_MODE != 'cold' }}
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID -e EM_MATCHED -e EM_OUTCOME \
            -e CC_MATCHED -e CC_OUTCOME -e SAVE_CACHES -e DAWN_MATCHED -e DAWN_HIT \
            -e DAWN_OUTCOME -e EM_HIT -e CC_HIT \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          if [[ "$BIC_METRICS_MODE" == basic ]]; then
            node build/tooling/tools/ci/cli.js cache --kind dawn --requested "$(jq -r .dawnKey build/cache-plan.json)" \
              --matched "$DAWN_MATCHED" --hit "$DAWN_HIT" --outcome "$DAWN_OUTCOME" --save-eligible "$SAVE_CACHES" || printf '%s\n' '[pipeline-metrics] Optional cache observation unavailable.' >&2
            node build/tooling/tools/ci/cli.js cache --kind em --requested "$(jq -r .emKey build/cache-plan.json)" \
              --matched "$EM_MATCHED" --hit "$EM_HIT" --outcome "$EM_OUTCOME" --save-eligible "$SAVE_CACHES" || printf '%s\n' '[pipeline-metrics] Optional cache observation unavailable.' >&2
            node build/tooling/tools/ci/cli.js cache --kind cc --requested "$(jq -r .ccKey build/cache-plan.json)" \
              --matched "$CC_MATCHED" --hit "$CC_HIT" --outcome "$CC_OUTCOME" --save-eligible "$SAVE_CACHES" || printf '%s\n' '[pipeline-metrics] Optional cache observation unavailable.' >&2
          fi
          node build/tooling/tools/toolchain/cli.js prepare \
            --checkout-root "$GITHUB_WORKSPACE" --tools-root "$GITHUB_WORKSPACE/.tools"
          node --input-type=module <<'ADOPT_CACHES'
          import { lstat, mkdir, readFile, rename, rm } from 'node:fs/promises';
          import { dirname } from 'node:path';
          import { cacheRestoreDecision } from './build/tooling/tools/toolchain/cache.js';
          const plan = JSON.parse(await readFile('build/cache-plan.json', 'utf8'));
          for (const [kind, requestedKey, staging, destination, restorePrefix] of [
            ['EM', plan.emKey, plan.emStagingPath, plan.emCachePath, plan.emRestorePrefix],
            ['CC', plan.ccKey, plan.ccStagingPath, plan.ccCachePath, plan.ccRestorePrefix],
          ]) {
            const matchedKey = process.env[`${kind}_MATCHED`] || undefined;
            const outcome = process.env[`${kind}_OUTCOME`] === 'success' ? 'success' : 'failure';
            const directory = await lstat(staging).catch(error => {
              if (error.code === 'ENOENT') return undefined;
              throw error;
            });
            if (directory?.isDirectory() && cacheRestoreDecision({ requestedKey, matchedKey, outcome, restorePrefix }) === 'accept') {
              await rm(destination, { recursive: true, force: true });
              await mkdir(dirname(destination), { recursive: true });
              await rename(staging, destination);
            } else {
              await rm(staging, { recursive: true, force: true });
            }
          }
          ADOPT_CACHES
          planned_em_cache="$EM_CACHE"
          source .tools/emsdk/emsdk_env.sh
          # SDK activation can unset EM_CACHE; restore the typed plan afterwards.
          export EM_CACHE="$planned_em_cache"
          ccache --zero-stats
          extra=()
          if [[ "$BIC_METRICS_PROFILE" == "webgpu-wasm64-jspi" && "$BIC_METRICS_VARIANT" == browser ]]; then
            extra+=(--include-toolchain-notices)
          fi
          node build/tooling/runtimes/llama-cpp/tools/cli.js build \
            --checkout-root "$GITHUB_WORKSPACE" --tooling-root "$GITHUB_WORKSPACE/build/tooling" \
            --output-root "$GITHUB_WORKSPACE/build/runtimes/llama-cpp" --toolchain-root "$GITHUB_WORKSPACE/.tools" \
            --expected-commit "$LCB_SOURCE_COMMIT" --kind wasm --fresh \
            --profile "$BIC_METRICS_PROFILE" --variant "$BIC_METRICS_VARIANT" --jobs 4 "${extra[@]}"
          if [[ "$BIC_METRICS_PROFILE" == cpu-wasm32 && "$BIC_METRICS_VARIANT" == browser ]]; then
            BICORE_EMSDK_ROOT="$GITHUB_WORKSPACE/.tools/emsdk" BICORE_EMSDK_NODE="$EMSDK_NODE" \
              EM_CONFIG="$GITHUB_WORKSPACE/.tools/emsdk/.emscripten" \
              node --test build/tooling/tests/tools/abi/wasm.test.js
          fi
          if [[ "$BIC_METRICS_PROFILE" == webgpu-wasm32-jspi && "$BIC_METRICS_VARIANT" == browser ]]; then
            BICORE_LLAMA_ABI_SCHEMA="$GITHUB_WORKSPACE/build/runtimes/llama-cpp/build/wasm/$BIC_METRICS_PROFILE/$BIC_METRICS_VARIANT/generated/schema.json" \
              node --test build/tooling/tests/tools/abi/current-api.test.js
          fi
          ccache --show-stats
          if [[ "$SAVE_CACHES" == true ]]; then
            node --input-type=module <<'STAGE_CACHES'
          import { cp, mkdir, readFile, rename, rm } from 'node:fs/promises';
          import { dirname } from 'node:path';
          const plan = JSON.parse(await readFile('build/cache-plan.json', 'utf8'));
          for (const [source, destination] of [[plan.emCachePath, plan.emStagingPath], [plan.ccCachePath, plan.ccStagingPath]]) {
            await rm(destination, { recursive: true, force: true });
            await mkdir(dirname(destination), { recursive: true });
            await rename(source, destination);
          }
          await rm('.cache/restored/dawn', { recursive: true, force: true });
          await cp('.tools/downloads', '.cache/restored/dawn', { recursive: true });
          STAGE_CACHES
          fi
          BICORE_OFFLINE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: profile-build-${{ matrix.profile }}-${{ matrix.variant }}
          path: |
            build/runtimes/llama-cpp/stage/
            build/runtimes/llama-cpp/toolchain-licenses/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 14
      - uses: actions/cache/save@v6.1.0
        id: save-dawn
        if: success() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.actor != 'dependabot[bot]' && env.BIC_CACHE_MODE != 'cold' && steps.dawn.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          key: ${{ steps.plan.outputs.dawn-key }}
          path: .cache/restored/dawn
      - uses: actions/cache/save@v6.1.0
        id: save-em
        if: success() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.actor != 'dependabot[bot]' && env.BIC_CACHE_MODE != 'cold' && steps.em.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          key: ${{ steps.plan.outputs.em-key }}
          path: ${{ steps.plan.outputs.em-staging }}
      - uses: actions/cache/save@v6.1.0
        id: save-cc
        if: success() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.actor != 'dependabot[bot]' && env.BIC_CACHE_MODE != 'cold' && steps.cc.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          key: ${{ steps.plan.outputs.cc-key }}
          path: ${{ steps.plan.outputs.cc-staging }}
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/ci/cli.js cache-save --kind dawn --outcome "${{ steps.save-dawn.outcome }}"
          node build/tooling/tools/ci/cli.js cache-save --kind em --outcome "${{ steps.save-em.outcome }}"
          node build/tooling/tools/ci/cli.js cache-save --kind cc --outcome "${{ steps.save-cc.outcome }}"
          node build/tooling/tools/ci/cli.js summary --directory "$RUNNER_TEMP/bic-pipeline-metrics" --ninja "build/runtimes/llama-cpp/build/wasm/$BIC_METRICS_PROFILE/$BIC_METRICS_VARIANT/.ninja_log"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-compile-${{ matrix.profile }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14
  build:
    name: Package and validate llama.cpp
    needs: [test, qsa-native, compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BIC_METRICS_RUNTIME: llama-cpp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq unzip \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          bash .github/scripts/run-offline.sh \
            -e HOME=/tmp "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out only this runtime's pinned upstreams
        working-directory: .
        run: git submodule update --init --recursive --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
      - name: Acquire locked development dependencies (online)
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit the checked-out tools and verify source identity
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          npm run tooling:build
          BICORE_OFFLINE
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: profile-build-*
          path: build/runtimes/llama-cpp/
          merge-multiple: true
      - name: Assemble runtime-only package
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js package runtime --runtime llama-cpp \
            --checkout-root "$GITHUB_WORKSPACE" --build-root "$GITHUB_WORKSPACE/build/runtimes/llama-cpp/stage" \
            --output "$GITHUB_WORKSPACE/build/runtime-packages/llama-cpp" --defer-npm-pack \
            --license-root "$GITHUB_WORKSPACE/build/runtimes/llama-cpp/toolchain-licenses/emscripten" \
            --license-root "$GITHUB_WORKSPACE/build/runtimes/llama-cpp/toolchain-licenses/emdawnwebgpu_pkg" \
            --license-root "$GITHUB_WORKSPACE/runtimes/llama-cpp/vendor/llama.cpp"
          BICORE_OFFLINE
      - name: Install browser test harness (online)
        shell: bash
        run: |
          npm install --prefix .tools/browser --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Prepare Chromium (online)
        shell: bash
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" .tools/browser/node_modules/.bin/playwright install chromium
      - name: Test and finalize the same runtime snapshot
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/cli.js validation runtime --runtime llama-cpp \
            --checkout-root "$GITHUB_WORKSPACE" --package "$GITHUB_WORKSPACE/build/runtime-packages/llama-cpp" \
            --receipt "$GITHUB_WORKSPACE/build/runtime-validation/llama-cpp.json"
          BICORE_OFFLINE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: llama-runtime-package
          path: build/runtime-packages/llama-cpp/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/run-offline.sh \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e LCB_SOURCE_COMMIT -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE \
            -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT -e BIC_CACHE_MODE -e EM_CACHE -e EM_COMPILER_WRAPPER \
            -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          node build/tooling/tools/ci/cli.js summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-build
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14
