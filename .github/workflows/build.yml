name: Build and publish runtime

on:
  push:
    branches-ignore:
      - artifacts
      - 'artifacts/**'
  # A human-created PR is the handoff after the updater's GITHUB_TOKEN push.
  # Push + synchronize duplicates are intentional; there is no deduplication gate.
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - artifacts
      - 'artifacts/**'
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Shared cache use (cold also forbids saving)
        type: choice
        default: enabled
        options: [enabled, cold]
      metrics_mode:
        description: Optional pipeline timings (does not disable validation or tests)
        type: choice
        options: [basic, 'off']
        default: basic

# Network operations belong at explicit workflow boundaries for auditability.
# Keep destinations, credentials and remote writes visible here instead of hiding
# them in repository Python/shell wrappers. Local processing belongs in ordinary Python modules.
# PR events normally check out a synthetic merge commit. All jobs deliberately
# build the immutable PR head instead, so push and PR artifacts share a source
# identity and comments can match the manifest to the actual PR head.
env:
  PYTHONPATH: ${{ github.workspace }}
  BIC_CACHE_MODE: ${{ github.event.inputs.cache_mode || 'enabled' }}
  LCB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  BIC_METRICS_MODE: ${{ inputs.metrics_mode || 'basic' }}

defaults:
  run:
    working-directory: runtimes/llama-cpp

permissions:
  contents: read

jobs:
  test:
    name: Test host and publication code
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BIC_METRICS_RUNTIME: llama-cpp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out only this runtime's pinned upstreams
        working-directory: .
        run: git submodule update --init --recursive --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
      - name: Acquire pinned TypeScript compiler (online)
        working-directory: .
        shell: bash
        run: |
          version="$(jq -er '.typescriptVersion | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' toolchain/config.json)"
          npm install --prefix .tools/typescript --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "typescript@$version"
      - name: Acquire pinned Dawn headers for native contracts (online)
        # Native contracts need only Dawn declarations, not an Emscripten install.
        working-directory: .
        shell: bash
        run: |
          tag="$(jq -er '.dawnTag | select(test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))' toolchain/config.json)"
          checksum="$(jq -er '.dawnSha256 | select(test("^[a-f0-9]{64}$"))' toolchain/config.json)"
          mkdir -p .tools/downloads
          archive=".tools/downloads/emdawnwebgpu_pkg-${tag}.zip"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "https://github.com/google/dawn/releases/download/${tag}/emdawnwebgpu_pkg-${tag}.zip" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check -
      - name: Verify the checked-out source identity
        shell: bash
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          BICORE_OFFLINE
      - name: Test host and publication code
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          (cd "$GITHUB_WORKSPACE" && python3 -m build_tools.toolchain.prepare --dawn-only)
          export LCB_TEST_DAWN_PACKAGE="$GITHUB_WORKSPACE/.tools/emdawnwebgpu_pkg"
          python3 -m build_tools.metrics run --phase test.node_host -- npm test
          python3 -m build_tools.metrics run --phase test.publication_python -- env BIC_METRICS_MODE=off python3 -m unittest discover -s ../../tests/build_tools -t ../.. -p 'test_*.py'
          python3 -m build_tools.metrics run --phase test.llama_python -- env BIC_METRICS_MODE=off python3 -m unittest discover -s ../../tests/runtimes/llama_cpp -t ../.. -p 'test_*.py'
          BICORE_OFFLINE
      - name: Test bounded BF16 weight expansion with native GGML
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          python3 -m build_tools.metrics run --phase native.configure -- cmake -S ../../tests/runtimes/llama_cpp/mtmd-bf16 -B build/mtmd-bf16-tests -DLCB_LLAMA_SOURCE="$PWD/vendor/llama.cpp"
          python3 -m build_tools.metrics run --phase native.build -- cmake --build build/mtmd-bf16-tests --target mtmd-bf16-test --parallel 2
          python3 -m build_tools.metrics run --phase native.test -- build/mtmd-bf16-tests/mtmd-bf16-test
          BICORE_OFFLINE
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          python3 -m build_tools.metrics_summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-test
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14
  qsa-native:
    name: Compare QSA all-pools native graphs
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BIC_METRICS_RUNTIME: llama-cpp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git python3 build-essential cmake ninja-build clang ccache jq \
              libglib2.0-0t64 libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
              libgbm1 libxcb1 libxkbcommon0 libasound2t64 libcups2t64 libdrm2 libpango-1.0-0 \
              libcairo2 fonts-liberation && rm -rf /var/lib/apt/lists/*
          COPY --from=node /usr/local/ /usr/local/
          BICORE_DOCKERFILE
          docker pull node:22.16.0-bookworm
          docker pull ubuntu:24.04
          docker build --tag "bicore-offline:$GITHUB_JOB" "$image_context"
          printf 'BIC_OFFLINE_IMAGE=bicore-offline:%s\n' "$GITHUB_JOB" >> "$GITHUB_ENV"
          docker image inspect --format '{{.Id}}' node:22.16.0-bookworm ubuntu:24.04 > "$image_context/environment"
          cat "$image_context/Dockerfile" >> "$image_context/environment"
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true "bicore-offline:$GITHUB_JOB" \
            bash -euo pipefail -c 'dpkg-query -W; node --version; npm --version; python3 --version' >> "$image_context/environment"
          fingerprint="$(sha256sum "$image_context/environment" | cut -d ' ' -f 1)"
          printf 'BIC_OFFLINE_ENVIRONMENT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check out only this runtime's pinned upstreams
        working-directory: .
        run: git submodule update --init --recursive --depth=1 -- runtimes/llama-cpp/vendor/llama.cpp
      - name: Verify the checked-out source identity
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
          BICORE_OFFLINE
      - name: Compare separate reference and optimized native builds
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          python3 -m build_tools.metrics run --phase native.qsa_regression -- python3 ../../tests/runtimes/llama_cpp/qsa-selection/run.py --source "$PWD/vendor/llama.cpp" --work "$PWD/build/qsa-regression" --jobs 2
          BICORE_OFFLINE
      - name: Upload native comparison traces and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qsa-native-${{ github.run_attempt }}
          path: runtimes/llama-cpp/build/qsa-regression/qsa-results/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
      - name: Summarize optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        run: |
          docker run --network none --rm -i --cap-drop=ALL --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" \
            -e HOME="$RUNNER_TEMP/bicore-home" -e CI=true -e PYTHONPATH="$GITHUB_WORKSPACE" \
            -e NPM_CONFIG_OFFLINE=true -e GIT_NO_LAZY_FETCH=1 \
            -e PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.tools/browser-binaries" \
            -e BICORE_TYPESCRIPT_COMPILER="$GITHUB_WORKSPACE/.tools/typescript/node_modules/typescript/bin/tsc" \
            -e GITHUB_WORKSPACE -e GITHUB_OUTPUT -e GITHUB_ENV -e GITHUB_STEP_SUMMARY -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e RUNNER_TEMP -e RUNNER_OS \
            -e RUNNER_ARCH -e ImageOS -e ImageVersion -e LCB_SOURCE_COMMIT -e BIC_CACHE_MODE \
            -e BIC_METRICS_MODE -e BIC_METRICS_RUNTIME -e BIC_METRICS_PROFILE -e BIC_METRICS_VARIANT -e BIC_OFFLINE_ENVIRONMENT \
            -e EM_CACHE -e EM_COMPILER_WRAPPER -e CCACHE_DIR -e CCACHE_CONFIGPATH -e BIC_CACHE_ID \
            "$BIC_OFFLINE_IMAGE" bash -euo pipefail <<'BICORE_OFFLINE'
          mkdir -p "$HOME"
          python3 -m build_tools.metrics_summary --directory "$RUNNER_TEMP/bic-pipeline-metrics"
          BICORE_OFFLINE
      - name: Upload optional pipeline timings
        if: always() && env.BIC_METRICS_MODE == 'basic'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-metrics-${{ github.run_attempt }}-qsa-native
          path: ${{ runner.temp }}/bic-pipeline-metrics/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 1
  compile:
    name: Build llama.cpp ${{ matrix.profile }} / ${{ matrix.variant }}
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Intentionally omit max-parallel: use all available runners to reduce build wait time.
      # Do not add a workflow-level parallelism cap; runner/account limits still apply.
      matrix:
        profile:
          - cpu-wasm32
          - webgpu-wasm64-jspi-gpu-profile
          - webgpu-wasm32-asyncify
          - webgpu-wasm32-jspi
          - webgpu-wasm64-jspi
        variant:
          - browser
          - test
    env:
      BIC_METRICS_RUNTIME: llama-cpp
      BIC_METRICS_PROFILE: ${{ matrix.profile }}
      BIC_METRICS_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: false
          persist-credentials: false
      - name: Acquire offline execution image (online)
        # Public base images and apt packages are acquired without repository source.
        # The final build image ID includes timestamps; cache identity uses actual
        # base identities, recipe bytes and installed package versions instead.
        working-directory: .
        shell: bash
        run: |
          image_context="$(mktemp -d "$RUNNER_TEMP/bicore-image.XXXXXX")"
          cat > "$image_context/Dockerfile" <<'BICORE_DOCKERFILE'
          FROM node:22.16.0-bookworm AS node
